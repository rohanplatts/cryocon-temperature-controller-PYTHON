name: cryocon-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - matplotlib
  - pyvisa
  - pip
# installing github currently for development version control
  - git
# Spyder 6.1.3 compatibility
  - spyder-kernels=3.1.3
  - ipykernel
  - ipython 
  - pyzmq
  - jupyter_client
  - jupyter_core
  - traitlets
  - cloudpickle
  - pip:
    - cryocon-22c-controller